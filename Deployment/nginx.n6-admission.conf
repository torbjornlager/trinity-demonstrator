worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 256; }
http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Caddy overwrites this header with the actual socket peer address.
    # The listener is private to the Compose network, never host-published.
    map $http_x_real_ip $n6_client {
        "" $binary_remote_addr;
        default $http_x_real_ip;
    }
    map $http_upgrade $upgrade_connection {
        default upgrade;
        "" close;
    }
    map "$request_method:$uri" $login_client {
        default "";
        "POST:/login" $n6_client;
    }
    map $uri $query_client {
        default "";
        /call $n6_client;
    }
    limit_req_zone $query_client zone=n6_query:1m rate=120r/m;
    limit_req_zone $login_client zone=n6_login:1m rate=6r/m;
    limit_conn_zone $n6_client zone=n6_per_client:1m;
    limit_conn_zone $server_name zone=n6_total:1m;
    log_format admission '$n6_client $request_method $uri $status $limit_conn_status';
    access_log /dev/stdout admission;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    large_client_header_buffers 2 256k;
    client_max_body_size 256k;
    client_header_timeout 15s;
    client_body_timeout 15s;
    keepalive_timeout 15s;

    server {
        listen 8080;
        server_name n6;
        # Counts active HTTP requests and upgraded WebSockets, not idle HTTP.
        # Existing requests/sessions are retained when new work is rejected.
        limit_req zone=n6_query burst=60 nodelay;
        limit_req zone=n6_login burst=6 nodelay;
        limit_req_status 429;
        limit_conn n6_per_client 16;
        limit_conn n6_total 32;
        limit_conn_status 429;
        error_page 429 = @busy;
        location @busy {
            default_type text/plain;
            add_header Retry-After 5 always;
            return 429 "N5 is busy. Please retry shortly.\n";
        }
        location / {
            # Re-resolve after the backend is recreated by Compose.
            set $n6_origin http://wp_n6:3060;
            proxy_pass $n6_origin$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $upgrade_connection;
            proxy_set_header X-Forwarded-For $http_x_real_ip;
            proxy_set_header X-Forwarded-Proto https;
            # No visitor-supplied identity or capability becomes trusted.
            proxy_set_header X-Web-Prolog-User "";
            proxy_set_header X-Web-Prolog-Principal "";
            proxy_set_header X-Authenticated-User "";
            proxy_set_header X-Web-Prolog-Capabilities "";
            proxy_set_header X-Web-Prolog-Caps "";
            proxy_set_header X-Web-Prolog-Internal-Proxy "";
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
