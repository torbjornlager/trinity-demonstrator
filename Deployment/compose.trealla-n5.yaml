# Opt-in Trealla replacement for the private N5 execution backend.
#
# Apply after the normal compose file. The ordinary compose file is left
# untouched and is therefore the rollback configuration.
#
#   docker compose -f Deployment/compose.yaml \
#     -f Deployment/compose.trealla-n5.yaml \
#     --env-file Deployment/.env build wp_n5 caddy
#   docker compose -f Deployment/compose.yaml \
#     -f Deployment/compose.trealla-n5.yaml \
#     --env-file Deployment/.env up -d --no-deps wp_n5 caddy

services:
  wp_n5:
    build:
      context: ..
      dockerfile: Deployment/Dockerfile.n5-linda
      additional_contexts:
        trealla_runtime: service:wp_n5_runtime
    environment:
      WP_PORT: "3060"
      WP_PUBLIC_URL: "https://n5.elfenbenstornet.se"
      WP_PROFILE: actor
      # Match the SWI N5 policy: oauth2-proxy authenticates the owner and
      # Caddy supplies that verified identity to the private Trealla node.
      WP_AUTH: private
      WP_OWNER: ${WP_N5_OWNER:?Set WP_N5_OWNER to your verified GitHub email}
      # Docker bridge peers are the only callers in this RFC1918 range; the
      # public port is exposed by Caddy alone, never by the Trealla service.
      WP_TRUSTED_PROXY_RANGES: ${WP_TREALLA_N5_TRUSTED_PROXY_RANGES:-172.16.0.0/12}
      WP_SANDBOX: ${WP_N5_SANDBOX:-blacklist}
      WP_ADMIN_TOKEN: ${WP_TREALLA_N5_ADMIN_TOKEN:?Set WP_TREALLA_N5_ADMIN_TOKEN to at least 24 random characters}
      WP_WS_ALLOWED_ORIGINS: https://n0.elfenbenstornet.se,https://n1.elfenbenstornet.se,https://n2.elfenbenstornet.se,https://n3.elfenbenstornet.se,https://n4.elfenbenstornet.se,https://n5.elfenbenstornet.se,https://n6.elfenbenstornet.se,https://n7.elfenbenstornet.se
      # Permit source loading and remote spawning within the deployed N0-N7
      # federation, matching the SWI node origin policy. Trealla follows the SWI policy: node/1 destinations must
      # match this explicit origin allowlist. The N2 alias uses the internal
      # HTTP backend only after the public origin passes policy checks.
      # N5 example URLs use the same N3 asset backend as its browser UI.
      WP_LOAD_URI_ORIGINS: https://n0.elfenbenstornet.se,https://n1.elfenbenstornet.se,https://n2.elfenbenstornet.se,https://n3.elfenbenstornet.se,https://n4.elfenbenstornet.se,https://n5.elfenbenstornet.se,https://n6.elfenbenstornet.se,https://n7.elfenbenstornet.se
      WP_LOAD_URI_ORIGIN_ALIASES: https://n2.elfenbenstornet.se=http://wp_n2:3052,https://n5.elfenbenstornet.se=http://wp_n3:3053
      # Execution routes use their own owner-installed map. The N5 source
      # alias above deliberately serves N3 assets and must not route RPCs.
      WP_PEER_RPC_ENDPOINTS_FILE: /app/owner_start/n5-peer-http-endpoints.pl
      WP_TUTORIAL_SECTIONS: local_actor,toplevels,distributed_actor
      # Load Trealla's attributed copies of the three shared-database layers
      # plus the owner-installed Linda client and directory, all image-baked.
      WP_SHARED_DB_FILES: /app/Deployment/shared_db_common.pl,/app/Deployment/shared_db_actor_common.pl,/app/Deployment/shared_db_n4.pl,/app/owner_services/linda_client.pl,/app/owner_start/shared_db_linda.pl
      WP_SHARED_DB_OVERLAY_FILE: ""
      # Match the SWI node's interactive defaults. Execution time is charged
      # only while a result slice is computing; idle time governs suspended
      # pages and abandoned sessions independently.
      WP_TIME_LIMIT: ${WP_TREALLA_N5_TIME_LIMIT:-300}
      WP_IDLE_LIMIT: ${WP_TREALLA_N5_IDLE_LIMIT:-300}
      WP_MAX_ACTORS: ${WP_TREALLA_N5_MAX_ACTORS:-128}
      WP_MAX_INFLIGHT_CALLS: ${WP_TREALLA_N5_MAX_INFLIGHT_CALLS:-4}
      WP_AUDIT_LOG_FILE: /state/audit.jsonl
      WP_TOKENS_FILE: /state/tokens.pl
      WP_DRAIN_GRACE_SECONDS: ${WP_DRAIN_GRACE_SECONDS:-10}
    volumes:
      - trealla_n5_state:/state
    pids_limit: 256

  # Build-only base image: the Trealla runtime remains owned by its repository.
  wp_n5_runtime:
    deploy:
      replicas: 0
    build:
      context: ..
      dockerfile: Deployment/Dockerfile.trealla

  caddy:
    build:
      context: ..
      dockerfile: Deployment/Dockerfile.caddy.trealla-n5

volumes:
  trealla_n5_state:
