name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      pinned_native:
        description: Run the pinned cross-repository SWI checks (requires dependency read access)
        type: boolean
        default: false

# A newer push to the same ref supersedes in-flight runs, so they don't
# pile up (and a hung run gets cancelled when the fix lands).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Retained comparison path; pinned checks are a separate explicit job.
      WP_NATIVE_MODE: legacy
    steps:
      - uses: actions/checkout@v6
        with:
          # T5 archives the historical demonstrator-peer tag to run its
          # cross-version interoperability peer.
          fetch-depth: 0
      - name: Install SWI-Prolog
        run: |
          sudo apt-add-repository -y ppa:swi-prolog/stable
          sudo apt-get update
          sudo apt-get install -y swi-prolog
          swipl --version
      - name: Run tiered test suite
        run: |
          set -u
          # Run each tier separately with its own timeout so a deadlocked
          # receive/await surfaces as a fast, attributable failure instead
          # of hanging the whole job to the runner limit. Every tier runs
          # even if an earlier one fails, so one CI run shows the full
          # picture. (Each invocation is a fresh swipl, as the layer-honesty
          # assertions require.)
          status=0
          for tier in LINT T0 T1 T2 T3 T4 T5; do
            echo "::group::Tier $tier"
            if timeout 360 ./tools/test.sh "$tier"; then
              echo "Tier $tier OK"
            else
              code=$?
              if [ "$code" -eq 124 ]; then
                echo "::error::Tier $tier TIMED OUT (likely a deadlocked receive/await)"
              else
                echo "::error::Tier $tier FAILED (exit $code)"
              fi
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

  pinned-native:
    if: github.event_name == 'workflow_dispatch' && inputs.pinned_native
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read exact native dependency pin
        id: native
        run: python3 tools/ci_pinned_swi.py --github-outputs "$GITHUB_OUTPUT"
      - name: Check out pinned native dependency
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.native.outputs.repository }}
          ref: ${{ steps.native.outputs.revision }}
          path: .trinity/ci-native
          # No access is provisioned here. A private dependency requires an
          # owner-supplied read credential; absence fails checkout, not fallback.
          token: ${{ secrets.SWI_NODE_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Install SWI-Prolog
        run: |
          sudo apt-add-repository -y ppa:swi-prolog/stable
          sudo apt-get update
          sudo apt-get install -y swi-prolog
          swipl --version
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Run pinned native and demonstrator integration checks
        run: >-
          python3 tools/ci_pinned_swi.py
          --native-root "$GITHUB_WORKSPACE/.trinity/ci-native"
          --output "$RUNNER_TEMP/pinned-swi-results"
      - name: Preserve check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-swi-results
          path: ${{ runner.temp }}/pinned-swi-results
          if-no-files-found: warn
