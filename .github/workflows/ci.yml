name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read exact native dependency pin
        id: native
        run: python3 tools/ci_pinned_swi.py --github-outputs "$GITHUB_OUTPUT"
      - name: Check out pinned native dependency
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.native.outputs.repository }}
          ref: ${{ steps.native.outputs.revision }}
          path: .trinity/ci-native
          token: ${{ secrets.SWI_NODE_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: ./.github/actions/setup-swi
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Run pinned native, demonstrator and browser checks
        run: >-
          python3 tools/ci_pinned_swi.py
          --native-root "$GITHUB_WORKSPACE/.trinity/ci-native"
          --output "$RUNNER_TEMP/pinned-swi-results"
      - name: Preserve check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-swi-results
          path: ${{ runner.temp }}/pinned-swi-results
          if-no-files-found: warn

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Read exact native dependency pin
        id: native
        run: python3 tools/ci_pinned_swi.py --github-outputs "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: ${{ steps.native.outputs.repository }}
          ref: ${{ steps.native.outputs.revision }}
          path: .trinity/ci-native
          token: ${{ secrets.SWI_NODE_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: ./.github/actions/setup-swi
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Assemble browser sources from pinned schema
        run: python3 tools/setup_swi.py --native-root .trinity/ci-native
      - name: Run WASM tier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wasm-ci-results"
          python3 tools/ci_timeout.py 360 -- bash tools/test.sh WASM 2>&1 | tee "$RUNNER_TEMP/wasm-ci-results/WASM.log"
      - name: Preserve WASM results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-results
          path: ${{ runner.temp }}/wasm-ci-results
          if-no-files-found: warn
